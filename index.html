<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ซินพิฑาน ชลบุรี · ระบบเข้า-ออกงาน</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --card: #1a1a24;
      --border: #2a2a3a;
      --accent-in: #00e5a0;
      --accent-out: #ff4d6d;
      --accent-blue: #4d9fff;
      --text: #f0f0f8;
      --text-dim: #7a7a9a;
      --glow-in: rgba(0,229,160,0.18);
      --glow-out: rgba(255,77,109,0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      overflow-x: hidden;
    }

    /* Ambient background */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 60vw;
      height: 60vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(77,159,255,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -10%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,229,160,0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== HEADER ===== */
    header {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-in));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    .logo-text {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .logo-text span { color: var(--accent-blue); }

    .clock-badge {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 14px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--text-dim);
    }

    #live-clock { color: var(--text); }

    /* ===== MAIN CARD ===== */
    .main-card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      z-index: 1;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }

    /* ===== TYPE TOGGLE ===== */
    .type-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .type-btn {
      padding: 18px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-family: 'Sarabun', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
    }

    .type-btn::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: transparent;
      transition: background 0.3s ease;
    }

    .type-btn.active-in {
      color: var(--accent-in);
      background: var(--glow-in);
    }
    .type-btn.active-in::after { background: var(--accent-in); }

    .type-btn.active-out {
      color: var(--accent-out);
      background: var(--glow-out);
    }
    .type-btn.active-out::after { background: var(--accent-out); }

    .type-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ===== CAMERA SECTION ===== */
    .camera-section {
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .camera-frame {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 16px;
      overflow: hidden;
      background: var(--surface);
      border: 2px solid var(--border);
      position: relative;
      transition: border-color 0.3s ease;
    }

    .camera-frame.active-in-border { border-color: var(--accent-in); box-shadow: 0 0 24px var(--glow-in); }
    .camera-frame.active-out-border { border-color: var(--accent-out); box-shadow: 0 0 24px var(--glow-out); }

    #video-feed, #captured-img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    #captured-img { display: none; }

    .camera-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Corner brackets */
    .corner { position: absolute; width: 20px; height: 20px; border-color: currentColor; border-style: solid; }
    .corner-tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }

    .corner-in { color: var(--accent-in); }
    .corner-out { color: var(--accent-out); }

    .camera-status {
      position: absolute;
      top: 12px; right: 12px;
      background: rgba(0,0,0,0.7);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rec-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ff4040;
      animation: blink 1.2s infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* Placeholder when no camera */
    .camera-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--text-dim);
    }

    .camera-placeholder svg { opacity: 0.4; }

    /* ===== CAPTURE BUTTON ===== */
    .capture-btn {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 3px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      position: relative;
    }

    .capture-btn:hover { transform: scale(1.05); }
    .capture-btn:active { transform: scale(0.95); }

    .capture-btn-inner {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: background 0.3s ease;
    }

    .capture-btn.in-mode .capture-btn-inner { background: var(--accent-in); box-shadow: 0 0 16px var(--glow-in); }
    .capture-btn.in-mode { border-color: var(--accent-in); }
    .capture-btn.out-mode .capture-btn-inner { background: var(--accent-out); box-shadow: 0 0 16px var(--glow-out); }
    .capture-btn.out-mode { border-color: var(--accent-out); }

    .retake-btn {
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-family: 'Sarabun', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: none;
    }
    .retake-btn:hover { border-color: var(--text-dim); color: var(--text); }
    .retake-btn.visible { display: block; }

    /* ===== FORM SECTION ===== */
    .form-section {
      padding: 0 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    .text-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'Sarabun', sans-serif;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }

    .text-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(77,159,255,0.1); }
    .text-input::placeholder { color: var(--text-dim); }

    /* ===== SUBMIT BUTTON ===== */
    .submit-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-family: 'Sarabun', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn.btn-in {
      background: linear-gradient(135deg, #00c87a, #00e5a0);
      color: #001a10;
      box-shadow: 0 8px 32px var(--glow-in);
    }
    .submit-btn.btn-out {
      background: linear-gradient(135deg, #e0304f, #ff4d6d);
      color: #fff;
      box-shadow: 0 8px 32px var(--glow-out);
    }

    .submit-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Loading spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== TOAST ===== */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.success { border-color: var(--accent-in); }
    #toast.error { border-color: var(--accent-out); }
    .toast-icon { font-size: 18px; }

    /* ===== SETTINGS MODAL ===== */
    

    /* ===== HISTORY ===== */
    .history-section {
      width: 100%;
      max-width: 520px;
      margin-top: 20px;
      position: relative;
      z-index: 1;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .history-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .clear-btn {
      font-size: 12px;
      color: var(--text-dim);
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
    }
    .clear-btn:hover { color: var(--accent-out); }

    #history-list { display: flex; flex-direction: column; gap: 8px; }

    .history-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .history-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .badge-in { background: var(--glow-in); color: var(--accent-in); border: 1px solid rgba(0,229,160,0.3); }
    .badge-out { background: var(--glow-out); color: var(--accent-out); border: 1px solid rgba(255,77,109,0.3); }

    .history-info { flex: 1; min-width: 0; }
    .history-name { font-size: 14px; font-weight: 600; }
    .history-time { font-size: 12px; color: var(--text-dim); font-family: 'Space Mono', monospace; margin-top: 2px; }

    .history-status { font-size: 12px; color: var(--accent-in); flex-shrink: 0; }
    .history-status.err { color: var(--accent-out); }

    /* ===== STATUS BAR ===== */
    .status-bar {
      display: flex;
      gap: 8px;
      padding: 12px 24px 0;
    }
    .status-chip {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      transition: all 0.3s;
    }
    .status-chip.done-in  { background: var(--glow-in);  color: var(--accent-in);  border-color: rgba(0,229,160,0.3); }
    .status-chip.done-out { background: var(--glow-out); color: var(--accent-out); border-color: rgba(255,77,109,0.3); }
    .status-chip.loading  { opacity: 0.5; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    .submit-btn:disabled,
    .submit-btn[disabled] {
      opacity: 0.35 !important;
      cursor: not-allowed !important;
      transform: none !important;
      filter: none !important;
      pointer-events: none !important;
      box-shadow: none !important;
    }

    /* ===== EMPLOYEE SELECT ===== */
    .employee-select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 40px 14px 16px;
      color: var(--text);
      font-family: 'Sarabun', sans-serif;
      font-size: 15px;
      outline: none;
      appearance: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .employee-select:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(77,159,255,0.1);
    }
    .employee-select option { background: var(--card); color: var(--text); }
    .select-wrap {
      position: relative;
    }
    .select-arrow {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-dim);
      font-size: 11px;
    }

    /* ===== CAMERA SELECT ===== */
    .camera-select-wrap {
      width: 100%;
      position: relative;
    }
    .camera-select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 36px 9px 12px;
      color: var(--text);
      font-family: 'Sarabun', sans-serif;
      font-size: 13px;
      outline: none;
      appearance: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .camera-select:focus { border-color: var(--accent-blue); }
    .camera-select-icon {
      position: absolute;
      right: 10px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-dim);
      font-size: 12px;
    }

    /* ===== FACE DETECTION ===== */
    #face-canvas {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 3;
    }
    .face-status {
      position: absolute;
      bottom: 12px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      white-space: nowrap;
      z-index: 4;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .face-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-dim);
      transition: background 0.3s;
    }
    .face-dot.detected { background: var(--accent-in); animation: blink 1s infinite; }
    .face-dot.loading  { background: var(--accent-blue); animation: blink 0.6s infinite; }

    /* ===== CANVAS (hidden) ===== */
    #snapshot-canvas { display: none; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 420px) {
      body { padding: 16px 12px 40px; }
      .camera-section { padding: 16px; }
      .form-section { padding: 0 16px 16px; }
      .logo-text { font-size: 16px; }
    }

    /* ===== SUCCESS POPUP ===== */
    #success-popup {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      pointer-events: none;
      opacity: 0;
    }
    #success-popup.show {
      pointer-events: all;
      animation: popupFadeIn 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    #success-popup.hide {
      animation: popupFadeOut 0.3s ease forwards;
    }
    @keyframes popupFadeIn {
      from { opacity:0; transform: scale(0.85); }
      to   { opacity:1; transform: scale(1); }
    }
    @keyframes popupFadeOut {
      from { opacity:1; transform: scale(1); }
      to   { opacity:0; transform: scale(0.9); }
    }

    .popup-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(12px);
    }

    .popup-card {
      position: relative;
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border-radius: 28px;
      padding: 36px 28px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
    }

    /* Glow ring behind icon */
    .popup-glow {
      position: absolute;
      top: -60px; left: 50%;
      transform: translateX(-50%);
      width: 260px; height: 260px;
      border-radius: 50%;
      opacity: 0.18;
      filter: blur(40px);
    }
    .popup-glow.glow-in  { background: var(--accent-in); }
    .popup-glow.glow-out { background: var(--accent-out); }

    /* Confetti particles */
    .popup-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 7px; height: 7px;
      border-radius: 2px;
      opacity: 0;
      animation: particleFly 1.2s ease forwards;
    }
    @keyframes particleFly {
      0%   { transform: translate(0,0) rotate(0deg) scale(1); opacity:1; }
      100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.2); opacity:0; }
    }

    /* Check / X icon circle */
    .popup-icon-wrap {
      width: 88px; height: 88px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
      position: relative;
    }
    .popup-icon-wrap.icon-in  { background: var(--glow-in);  border: 2px solid var(--accent-in); }
    .popup-icon-wrap.icon-out { background: var(--glow-out); border: 2px solid var(--accent-out); }

    .popup-icon-svg {
      animation: iconPop 0.5s cubic-bezier(0.34,1.8,0.64,1) 0.15s both;
    }
    @keyframes iconPop {
      from { transform: scale(0) rotate(-20deg); opacity: 0; }
      to   { transform: scale(1) rotate(0deg);   opacity: 1; }
    }

    /* Ripple ring */
    .popup-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid currentColor;
      animation: ringPulse 1.4s ease-out 0.2s infinite;
      opacity: 0;
    }
    .popup-icon-wrap.icon-in  .popup-ring { color: var(--accent-in); }
    .popup-icon-wrap.icon-out .popup-ring { color: var(--accent-out); }
    @keyframes ringPulse {
      0%   { transform: scale(1);   opacity: 0.6; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .popup-type {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      animation: slideUp 0.4s ease 0.2s both;
    }
    .popup-type.type-in  { color: var(--accent-in); }
    .popup-type.type-out { color: var(--accent-out); }

    .popup-name {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-bottom: 6px;
      animation: slideUp 0.4s ease 0.28s both;
    }

    .popup-msg {
      font-size: 15px;
      color: var(--text-dim);
      margin-bottom: 24px;
      animation: slideUp 0.4s ease 0.34s both;
    }

    .popup-time {
      font-family: 'Space Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      animation: slideUp 0.4s ease 0.4s both;
    }

    .popup-date {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 28px;
      animation: slideUp 0.4s ease 0.44s both;
    }

    .popup-close {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-family: 'Sarabun', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      animation: slideUp 0.4s ease 0.5s both;
    }
    .popup-close.close-in  { background: linear-gradient(135deg,#00c87a,#00e5a0); color:#001a10; box-shadow: 0 8px 24px var(--glow-in); }
    .popup-close.close-out { background: linear-gradient(135deg,#e0304f,#ff4d6d); color:#fff;    box-shadow: 0 8px 24px var(--glow-out); }
    .popup-close:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .popup-close:active { transform: translateY(0); }

    @keyframes slideUp {
      from { opacity:0; transform: translateY(14px); }
      to   { opacity:1; transform: translateY(0); }
    }

    /* Photo thumbnail in popup */
    .popup-photo {
      width: 64px; height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      margin-bottom: 14px;
      animation: slideUp 0.4s ease 0.22s both;
    }
  </style>

  <div class="main-card">
    <!-- Type Toggle -->
    <div class="type-toggle">
      <button class="type-btn active-in" id="btn-checkin" onclick="setType('in')">
        <div class="type-dot"></div> เข้างาน
      </button>
      <button class="type-btn" id="btn-checkout" onclick="setType('out')">
        <div class="type-dot"></div> ออกงาน
      </button>
    </div>

    <!-- Status Bar -->
    <div class="status-bar" id="status-bar" style="display:none">
      <div class="status-chip loading" id="chip-in">
        <div class="status-dot"></div>
        <span id="chip-in-text">Check-in</span>
      </div>
      <div class="status-chip loading" id="chip-out">
        <div class="status-dot"></div>
        <span id="chip-out-text">Check-out</span>
      </div>
    </div>

    <!-- Camera -->
    <div class="camera-section">
      <div class="camera-frame" id="camera-frame">
        <video id="video-feed" autoplay playsinline muted></video>
        <img id="captured-img" alt="ภาพถ่าย" />
        <canvas id="face-canvas"></canvas>
        <div class="camera-overlay">
          <div class="corner corner-tl corner-in" id="corner-tl"></div>
          <div class="corner corner-tr corner-in" id="corner-tr"></div>
          <div class="corner corner-bl corner-in" id="corner-bl"></div>
          <div class="corner corner-br corner-in" id="corner-br"></div>
          <div class="camera-status" id="cam-status">
            <div class="rec-dot"></div><span>LIVE</span>
          </div>
          <div class="face-status" id="face-status">
            <div class="face-dot loading" id="face-dot"></div>
            <span id="face-status-text">กำลังโหลด AI...</span>
          </div>
        </div>
      </div>
      <canvas id="snapshot-canvas"></canvas>
      <div id="photo-hint" style="
        font-size:12px;
        color:var(--accent-out);
        font-weight:600;
        letter-spacing:0.3px;
        display:flex;
        align-items:center;
        gap:5px;
        animation: blink 1.4s infinite;
      ">
        <span>📷</span><span>กรุณาถ่ายรูปก่อนบันทึก</span>
      </div>

      <div class="camera-select-wrap" id="camera-select-wrap">
        <select class="camera-select" id="camera-select" onchange="switchCamera()">
          <option value="">⏳ กำลังค้นหากล้อง...</option>
        </select>
        <span class="camera-select-icon">▼</span>
      </div>

      <button class="capture-btn in-mode" id="capture-btn" onclick="capturePhoto()">
        <div class="capture-btn-inner"></div>
      </button>
      <button class="retake-btn" id="retake-btn" onclick="retakePhoto()">↩ ถ่ายใหม่</button>
    </div>

    <div class="form-section">

<script>
  // ============================================================
  // STATE
  // ============================================================
  let currentType = 'in';
  let stream = null;
  let capturedImageBase64 = null;
  let selectedDeviceId = localStorage.getItem('camera_device_id') || '';
  let GAS_URL = localStorage.getItem('gas_url') || 'https://script.google.com/macros/s/AKfycbzpgKdLvooDB0C5lmacQ5xzjTsOif16G1jgOc0txm0cvCex-QABje17l8tBF5uYfhkJ/exec';
  let history = JSON.parse(localStorage.getItem('checkin_history') || '[]');

  // ============================================================
  // FACE DETECTION (Custom — ไม่ใช้ third-party model ที่อาจโหลดไม่ได้)
  // ใช้ canvas วาด animated overlay จำลอง face scan
  // ตรวจจับใบหน้าจริงๆ ด้วย window.FaceDetector API (Chrome/Edge)
  // หรือ fallback เป็น animated scan overlay ที่สมจริง
  // ============================================================
  let faceApiReady = false;
  let faceDetectionLoop = null;
  let faceDetected = false;
  let faceDetectorNative = null;
  let lastDetections = [];

  async function loadFaceApi() {
    const statusText = document.getElementById('face-status-text');
    const dot = document.getElementById('face-dot');

    // ลอง native FaceDetector API ก่อน (Chrome/Edge)
    if (window.FaceDetector) {
      try {
        faceDetectorNative = new FaceDetector({ fastMode: true, maxDetectedFaces: 3 });
        faceApiReady = true;
        dot.className = 'face-dot';
        statusText.textContent = 'ไม่พบใบหน้า';
        const video = document.getElementById('video-feed');
        if (stream && video.readyState >= 2) { resizeFaceCanvas(); startFaceDetection(); }
        console.log('Using native FaceDetector API');
        return;
      } catch(e) { faceDetectorNative = null; }
    }

    // Fallback: animated scan mode (ไม่มี model ต้องโหลด)
    faceApiReady = true;
    dot.className = 'face-dot loading';
    statusText.textContent = 'SCANNING...';
    const video = document.getElementById('video-feed');
    if (stream && video.readyState >= 2) { resizeFaceCanvas(); startFaceDetection(); }
  }

  function resizeFaceCanvas() {
    const canvas = document.getElementById('face-canvas');
    const frame  = document.getElementById('camera-frame');
    canvas.width  = frame.clientWidth;
    canvas.height = frame.clientHeight;
  }

  function startFaceDetection() {
    if (faceDetectionLoop) cancelAnimationFrame(faceDetectionLoop);
    detectFaceLoop();
  }

  function stopFaceDetection() {
    if (faceDetectionLoop) { cancelAnimationFrame(faceDetectionLoop); faceDetectionLoop = null; }
    const canvas = document.getElementById('face-canvas');
    if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  }

  // throttle ไม่ให้ detect ถี่เกินไป
  let lastDetectTime = 0;

  async function detectFaceLoop() {
    const video  = document.getElementById('video-feed');
    const canvas = document.getElementById('face-canvas');
    if (!stream || !video || video.paused || video.ended || !faceApiReady || video.style.display === 'none') return;

    const ctx = canvas.getContext('2d');
    const cw = canvas.width, ch = canvas.height;
    ctx.clearRect(0, 0, cw, ch);

    const now = Date.now();

    if (faceDetectorNative) {
      // ── Native FaceDetector ─────────────────────────────────
      if (now - lastDetectTime > 150) {
        lastDetectTime = now;
        try {
          const results = await faceDetectorNative.detect(video);
          lastDetections = results || [];
        } catch(e) { lastDetections = []; }
      }

      const vw = video.videoWidth  || cw;
      const vh = video.videoHeight || ch;
      const sx = cw / vw, sy = ch / vh;
      const statusText = document.getElementById('face-status-text');
      const dot = document.getElementById('face-dot');

      if (lastDetections.length > 0) {
        faceDetected = true;
        dot.className = 'face-dot detected';
        statusText.textContent = lastDetections.length > 1 ? `พบ ${lastDetections.length} ใบหน้า` : 'พบใบหน้า ✓';
        lastDetections.forEach(det => {
          const b = det.boundingBox;
          const x = b.x * sx, y = b.y * sy, w = b.width * sx, h = b.height * sy;
          drawFaceBox(ctx, x - 14, y - 14, w + 28, h + 28, now, 88);
        });
      } else {
        faceDetected = false;
        dot.className = 'face-dot';
        statusText.textContent = 'ไม่พบใบหน้า';
        drawScanOverlay(ctx, cw, ch, now);
      }

    } else {
      // ── Animated scan fallback ──────────────────────────────
      drawScanOverlay(ctx, cw, ch, now);
    }

    faceDetectionLoop = requestAnimationFrame(detectFaceLoop);
  }

  // วาด animated scan overlay เมื่อยังไม่พบหน้า / ไม่มี native API
  function drawScanOverlay(ctx, cw, ch, now) {
    const color = currentType === 'in' ? '#00e5a0' : '#ff4d6d';
    // scan line
    const scanY = (now / 6) % ch;
    const grad = ctx.createLinearGradient(0, scanY - 30, 0, scanY + 30);
    grad.addColorStop(0,   'transparent');
    grad.addColorStop(0.45, color + '22');
    grad.addColorStop(0.5,  color + '66');
    grad.addColorStop(0.55, color + '22');
    grad.addColorStop(1,   'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0, scanY - 30, cw, 60);

    // grid lines overlay จางๆ
    ctx.strokeStyle = color + '0d';
    ctx.lineWidth = 1;
    for (let gx = 0; gx < cw; gx += 32) {
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, ch); ctx.stroke();
    }
    for (let gy = 0; gy < ch; gy += 32) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(cw, gy); ctx.stroke();
    }

    // target reticle ตรงกลาง
    const cx = cw / 2, cy = ch / 2;
    const pulse = 0.7 + Math.sin(now / 500) * 0.3;
    const rSize = Math.min(cw, ch) * 0.28;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.5 * pulse;
    ctx.lineWidth = 1.5;
    // วงกลม
    ctx.beginPath();
    ctx.arc(cx, cy, rSize, 0, Math.PI * 2);
    ctx.stroke();
    // crosshair
    ctx.globalAlpha = 0.35 * pulse;
    const cLen = rSize * 0.3;
    ctx.beginPath();
    ctx.moveTo(cx - cLen, cy); ctx.lineTo(cx + cLen, cy);
    ctx.moveTo(cx, cy - cLen); ctx.lineTo(cx, cy + cLen);
    ctx.stroke();
    ctx.restore();
  }

  // วาด face box เมื่อตรวจจับได้
  function drawFaceBox(ctx, x, y, w, h, now, score) {
    const color = currentType === 'in' ? '#00e5a0' : '#ff4d6d';
    const pulse = 0.75 + Math.sin(now / 380) * 0.25;
    const cLen  = Math.min(w, h) * 0.2;

    // scan line
    const scanY = y + ((now / 5) % h);
    const grad = ctx.createLinearGradient(x, scanY - 16, x, scanY + 16);
    grad.addColorStop(0,   'transparent');
    grad.addColorStop(0.5, color + '44');
    grad.addColorStop(1,   'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(x, Math.max(y, scanY - 16), w, 32);

    // glow rect
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur  = 14 * pulse;
    ctx.strokeStyle = color + '55';
    ctx.lineWidth   = 1;
    ctx.strokeRect(x, y, w, h);
    ctx.restore();

    // corner brackets
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth   = 2.5;
    ctx.shadowColor = color;
    ctx.shadowBlur  = 10 * pulse;
    ctx.lineCap     = 'round';
    [[x, y, 1, 1],[x+w, y, -1, 1],[x, y+h, 1, -1],[x+w, y+h, -1, -1]].forEach(([cx2,cy2,dx,dy]) => {
      ctx.beginPath();
      ctx.moveTo(cx2 + dx * cLen, cy2);
      ctx.lineTo(cx2, cy2);
      ctx.lineTo(cx2, cy2 + dy * cLen);
      ctx.stroke();
    });
    ctx.restore();

    // score badge
    ctx.save();
    ctx.font = 'bold 10px "Space Mono", monospace';
    const label = 'FACE DETECTED';
    const tw = ctx.measureText(label).width;
    const bx = x + w / 2 - tw / 2 - 6, by = y - 20;
    ctx.fillStyle = color + 'cc';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx,by,tw+12,16,3) : ctx.rect(bx,by,tw+12,16);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.fillText(label, bx + 6, by + 11);
    ctx.restore();
  }

  window.addEventListener('resize', () => { if (faceApiReady && stream) resizeFaceCanvas(); });

  // ============================================================
  // CLOCK
  // ============================================================
  // ============================================================
  // CLOCK
  // ============================================================
  function updateClock() {
    const now = new Date();
    document.getElementById('live-clock').textContent =
      now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ============================================================
  // CAMERA
  // ============================================================
  // List all video devices and populate dropdown
  async function enumerateDevices() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(d => d.kind === 'videoinput');
      const sel = document.getElementById('camera-select');
      sel.innerHTML = '';
      if (videoDevices.length === 0) {
        sel.innerHTML = '<option value="">ไม่พบกล้อง</option>';
        return;
      }
      videoDevices.forEach((d, i) => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || `กล้อง ${i + 1}`;
        if (d.deviceId === selectedDeviceId) opt.selected = true;
        sel.appendChild(opt);
      });
      // If no saved device, pick first non-virtual
      if (!selectedDeviceId) {
        const physicalCam = videoDevices.find(d => {
          const lbl = (d.label || '').toLowerCase();
          return !['virtual','obs','snap camera','manycam','droidcam','iriun'].some(k => lbl.includes(k));
        });
        const chosen = physicalCam || videoDevices[0];
        selectedDeviceId = chosen.deviceId;
        sel.value = selectedDeviceId;
      }
    } catch(e) { console.warn('enumerateDevices:', e); }
  }

  async function startCamera(deviceId) {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    const video = document.getElementById('video-feed');
    const frame = document.getElementById('camera-frame');
    const oldPH = frame.querySelector('.camera-placeholder');
    if (oldPH) oldPH.remove();

    const useId = deviceId || selectedDeviceId || null;

    // ลอง constraints หลายแบบ รองรับทุกแพลตฟอร์ม (desktop/mobile/tablet)
    const tryConstraints = [];
    if (useId) {
      tryConstraints.push({ video: { deviceId: { exact: useId } } });
      tryConstraints.push({ video: { deviceId: useId } });
    }
    // mobile: prefer front camera
    tryConstraints.push({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } });
    tryConstraints.push({ video: { facingMode: 'user' } });
    tryConstraints.push({ video: { width: { ideal: 640 }, height: { ideal: 480 } } });
    tryConstraints.push({ video: true });

    let started = false;
    let lastErr = '';
    for (const c of tryConstraints) {
      try {
        const s = await navigator.mediaDevices.getUserMedia(c);
        stream = s;
        const track = stream.getVideoTracks()[0];
        // getSettings() อาจ return {} บน iOS Safari — ต้องตรวจ
        const settings = track.getSettings ? track.getSettings() : {};
        selectedDeviceId = settings.deviceId || useId || '';
        if (selectedDeviceId) localStorage.setItem('camera_device_id', selectedDeviceId);

        const sel = document.getElementById('camera-select');
        if (sel && selectedDeviceId) sel.value = selectedDeviceId;

        video.srcObject = stream;
        video.style.display = 'block';
        document.getElementById('captured-img').style.display = 'none';
        document.getElementById('cam-status').style.display = 'flex';
        started = true;
        // เริ่ม face detection หลัง video พร้อม
        video.addEventListener('loadedmetadata', () => {
          resizeFaceCanvas();
          if (faceApiReady) startFaceDetection();
        }, { once: true });
        break;
      } catch(err) {
        lastErr = err.name + ': ' + err.message;
        console.warn('Camera attempt failed:', lastErr);
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      }
    }

    if (!started) {
      video.style.display = 'none';
      const msg = lastErr.includes('NotAllowedError') || lastErr.includes('Permission')
        ? 'กรุณาอนุญาตการใช้กล้องใน Browser แล้วรีโหลดหน้า'
        : lastErr.includes('NotFoundError') || lastErr.includes('DevicesNotFound')
        ? 'ไม่พบกล้องในอุปกรณ์นี้'
        : 'ไม่สามารถเปิดกล้องได้: ' + lastErr;
      frame.insertAdjacentHTML('beforeend', `
        <div class="camera-placeholder" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;color:var(--text-dim);text-align:center">
          <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="opacity:0.5">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          <span style="font-size:12px;line-height:1.5">${msg}</span>
          <button onclick="startCamera()" style="margin-top:4px;padding:6px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:12px;cursor:pointer;">ลองอีกครั้ง</button>
        </div>`);
    }
  }

  async function switchCamera() {
    const sel = document.getElementById('camera-select');
    selectedDeviceId = sel.value;
    localStorage.setItem('camera_device_id', selectedDeviceId);
    capturedImageBase64 = null;
    document.getElementById('retake-btn').classList.remove('visible');
    document.getElementById('capture-btn').style.display = 'flex';
    document.getElementById('photo-hint').style.display  = 'flex';
    updateSubmitButton();
    await startCamera(selectedDeviceId);
  }

  function capturePhoto() {
    const video = document.getElementById('video-feed');
    const canvas = document.getElementById('snapshot-canvas');
    const img = document.getElementById('captured-img');

    if (!stream || !video.srcObject) {
      // Try to start camera if not available
      startCamera();
      return;
    }

    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);

    // Compress to reasonable size for sending to Apps Script
    capturedImageBase64 = canvas.toDataURL('image/jpeg', 0.55);

    img.src = capturedImageBase64;
    img.style.display = 'block';
    video.style.display = 'none';
    document.getElementById('cam-status').style.display = 'none';
    document.getElementById('retake-btn').classList.add('visible');
    document.getElementById('capture-btn').style.display = 'none';

    stopFaceDetection();
    showToast('📸 ถ่ายรูปสำเร็จ', 'info');
    document.getElementById('photo-hint').style.display = 'none';
    updateSubmitButton();
  }

  function retakePhoto() {
    capturedImageBase64 = null;
    const video = document.getElementById('video-feed');
    const img = document.getElementById('captured-img');
    video.style.display = 'block';
    img.style.display = 'none';
    document.getElementById('cam-status').style.display = 'flex';
    document.getElementById('retake-btn').classList.remove('visible');
    document.getElementById('capture-btn').style.display = 'flex';
  }

  // ============================================================
  // TYPE TOGGLE
  // ============================================================
  function setType(type) {
    currentType = type;

    // Reset รูปทุกครั้งที่สลับ เข้างาน/ออกงาน
    if (capturedImageBase64) {
      capturedImageBase64 = null;
      const video = document.getElementById('video-feed');
      const img   = document.getElementById('captured-img');
      video.style.display = 'block';
      img.style.display   = 'none';
      document.getElementById('cam-status').style.display = 'flex';
      document.getElementById('retake-btn').classList.remove('visible');
      document.getElementById('capture-btn').style.display = 'flex';
      document.getElementById('photo-hint').style.display  = 'flex';
    }

    if (faceApiReady && stream) startFaceDetection();
    const btnIn = document.getElementById('btn-checkin');
    const btnOut = document.getElementById('btn-checkout');
    const frame = document.getElementById('camera-frame');
    const captureBtn = document.getElementById('capture-btn');
    const submitBtn = document.getElementById('submit-btn');
    const btnLabel = document.getElementById('btn-label');
    const corners = ['corner-tl','corner-tr','corner-bl','corner-br'];

    if (type === 'in') {
      btnIn.className = 'type-btn active-in';
      btnOut.className = 'type-btn';
      frame.className = 'camera-frame active-in-border';
      captureBtn.className = 'capture-btn in-mode';
      submitBtn.className = 'submit-btn btn-in';
      corners.forEach(id => {
        document.getElementById(id).className = `corner ${id.replace('corner-', 'corner-')} corner-in`;
      });
    } else {
      btnIn.className = 'type-btn';
      btnOut.className = 'type-btn active-out';
      frame.className = 'camera-frame active-out-border';
      captureBtn.className = 'capture-btn out-mode';
      submitBtn.className = 'submit-btn btn-out';
      corners.forEach(id => {
        const el = document.getElementById(id);
        el.className = el.className.replace('corner-in', 'corner-out');
      });
    }
    updateSubmitButton();
  }

  // Fix corner IDs (simpler approach)
  document.addEventListener('DOMContentLoaded', () => {
    const overlays = document.querySelectorAll('.corner');
    overlays.forEach((el, i) => {
      const ids = ['corner-tl', 'corner-tr', 'corner-bl', 'corner-br'];
      el.id = ids[i];
    });
  });

  // ============================================================
  // CHECK STATUS (เช็คสถานะวันนี้ของพนักงานจาก Sheet)
  // ============================================================
  let todayStatus = { checkin: false, checkout: false };
  let statusCheckTimeout = null;

  async function checkEmployeeStatus(name) {
    if (!name || !GAS_URL) return;

    const bar = document.getElementById('status-bar');
    const chipIn  = document.getElementById('chip-in');
    const chipOut = document.getElementById('chip-out');
    const chipInTxt  = document.getElementById('chip-in-text');
    const chipOutTxt = document.getElementById('chip-out-text');

    bar.style.display = 'flex';
    chipIn.className  = 'status-chip loading';
    chipOut.className = 'status-chip loading';
    chipInTxt.textContent  = 'กำลังตรวจสอบ...';
    chipOutTxt.textContent = 'กำลังตรวจสอบ...';

    try {
      const url = GAS_URL + '?action=status&name=' + encodeURIComponent(name);
      const res = await fetch(url, { method: 'GET', redirect: 'follow' });
      const text = await res.text();
      const data = JSON.parse(text);
      todayStatus = data;
    } catch (err) {
      console.warn('checkEmployeeStatus error:', err);
      // ถ้าเช็คไม่ได้ ให้ผ่านไปก่อน
      todayStatus = { checkin: false, checkout: false };
    }

    // อัปเดต UI chip
    chipIn.className  = todayStatus.checkin  ? 'status-chip done-in'  : 'status-chip';
    chipOut.className = todayStatus.checkout ? 'status-chip done-out' : 'status-chip';
    chipInTxt.textContent  = todayStatus.checkin  ? '✓ Check-in แล้ว'  : 'ยังไม่ Check-in';
    chipOutTxt.textContent = todayStatus.checkout ? '✓ Check-out แล้ว' : 'ยังไม่ Check-out';

    // อัปเดตปุ่มบันทึก
    updateSubmitButton();
  }

  function updateSubmitButton() {
    const submitBtn = document.getElementById('submit-btn');
    const btnLabel  = document.getElementById('btn-label');
    const name      = document.getElementById('name-input').value.trim();
    const hasPhoto  = !!capturedImageBase64;

    // helper: ตั้งค่าปุ่ม
    function lock(text)   { submitBtn.disabled = true;  btnLabel.textContent = text; }
    function unlock(text) { submitBtn.disabled = false; btnLabel.textContent = text; }

    // ── ยังไม่ถ่ายรูป ────────────────────────────────────────────
    if (!hasPhoto) {
      lock(currentType === 'in' ? '📷 ถ่ายรูปก่อนเข้างาน' : '📷 ถ่ายรูปก่อนออกงาน');
      return;
    }

    // ── ยังไม่เลือกชื่อ ──────────────────────────────────────────
    if (!name) {
      lock(currentType === 'in' ? '— เลือกชื่อพนักงาน —' : '— เลือกชื่อพนักงาน —');
      return;
    }

    // ── มีรูป + มีชื่อ: ตรวจสถานะวันนี้ ─────────────────────────
    if (currentType === 'in') {
      todayStatus.checkin ? lock('✓ Check-in วันนี้แล้ว') : unlock('✓ บันทึกเข้างาน');
    } else {
      if (todayStatus.checkout)     lock('✓ Check-out วันนี้แล้ว');
      else if (!todayStatus.checkin) lock('⚠ ต้อง Check-in ก่อน');
      else                           unlock('✕ บันทึกออกงาน');
    }
  }

  // ============================================================
  // SUBMIT
  // ============================================================
  async function submitData() {
    const name = document.getElementById('name-input').value.trim();
    if (!name) {
      showToast('⚠️ กรุณาเลือกชื่อพนักงานก่อน', 'error');
      document.getElementById('name-input').focus();
      return;
    }
    if (!GAS_URL) {
      showToast('⚙️ กรุณาตั้งค่า URL ก่อน', 'error');
      openSettings();
      return;
    }

    const typeLabel = currentType === 'in' ? 'เข้างาน' : 'ออกงาน';

    // ── ตรวจสอบฝั่ง client ก่อน ──────────────────────────────────
    if (typeLabel === 'เข้างาน' && todayStatus.checkin) {
      showToast('⚠️ ' + name.split('(')[1]?.replace(')','') + ' Check-in วันนี้แล้ว', 'error');
      return;
    }
    if (typeLabel === 'ออกงาน' && todayStatus.checkout) {
      showToast('⚠️ ' + name.split('(')[1]?.replace(')','') + ' Check-out วันนี้แล้ว', 'error');
      return;
    }
    if (typeLabel === 'ออกงาน' && !todayStatus.checkin) {
      showToast('⚠️ ยังไม่ได้ Check-in วันนี้', 'error');
      return;
    }

    // UI loading
    const submitBtn = document.getElementById('submit-btn');
    const btnLabel  = document.getElementById('btn-label');
    const spinner   = document.getElementById('spinner');
    submitBtn.disabled = true;
    btnLabel.style.display = 'none';
    spinner.style.display = 'block';

    // ตรวจ double-check ไม่ให้ผ่านหากยังไม่ถ่ายรูป
    if (!capturedImageBase64) {
      showToast('📷 กรุณาถ่ายรูปก่อนบันทึก', 'error');
      return;
    }
    const imageData = capturedImageBase64;

    try {
      const payload = JSON.stringify({ name, type: typeLabel, image: imageData });
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: payload,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        redirect: 'follow'
      });

      const text = await res.text();
      console.log('Apps Script response:', text);

      if (text.startsWith('Success')) {
        const driveLink = text.split('|')[1] || '';
        const nickname = name.match(/\(([^)]+)\)/)?.[1] || name;
        addHistory(name, typeLabel, 'success', driveLink);
        localStorage.setItem('saved_name', name);

        // อัปเดตสถานะทันที
        if (typeLabel === 'เข้างาน')  todayStatus.checkin  = true;
        if (typeLabel === 'ออกงาน') todayStatus.checkout = true;

        // อัปเดต chips
        const chipIn  = document.getElementById('chip-in');
        const chipOut = document.getElementById('chip-out');
        if (typeLabel === 'เข้างาน') {
          chipIn.className = 'status-chip done-in';
          document.getElementById('chip-in-text').textContent = '✓ Check-in แล้ว';
        } else {
          chipOut.className = 'status-chip done-out';
          document.getElementById('chip-out-text').textContent = '✓ Check-out แล้ว';
        }

        // แสดง success popup
        showSuccessPopup(nickname, typeLabel, capturedImageBase64);

      } else if (text.startsWith('Duplicate')) {
        showToast('⚠️ ' + text.replace('Duplicate: ',''), 'error');
      } else if (text.startsWith('NoCheckin')) {
        showToast('⚠️ ยังไม่ได้ Check-in วันนี้', 'error');
      } else {
        throw new Error(text || 'ไม่ได้รับการตอบกลับ');
      }
    } catch (err) {
      console.error('Submit error:', err);
      showToast('❌ ' + (err.message || 'เกิดข้อผิดพลาด').slice(0, 60), 'error');
      addHistory(name, typeLabel, 'error', '');
    } finally {
      submitBtn.disabled = false;
      btnLabel.style.display = 'inline';
      spinner.style.display = 'none';
      updateSubmitButton();
    }
  }

  // ============================================================
  // SUCCESS POPUP
  // ============================================================
  function showSuccessPopup(nickname, typeLabel, photoBase64) {
    const isIn   = typeLabel === 'เข้างาน';
    const now    = new Date();
    const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
    const dateStr = now.toLocaleDateString('th-TH', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });

    // ── ตั้งค่า elements ────────────────────────────────────────
    const wrap   = document.getElementById('popup-icon-wrap');
    const glow   = document.getElementById('popup-glow');
    const svgEl  = document.getElementById('popup-icon-svg');
    const typeEl = document.getElementById('popup-type-label');
    const nameEl = document.getElementById('popup-name-label');
    const msgEl  = document.getElementById('popup-msg-label');
    const timeEl = document.getElementById('popup-time-label');
    const dateEl = document.getElementById('popup-date-label');
    const closeBtn = document.getElementById('popup-close-btn');
    const photoEl  = document.getElementById('popup-photo');

    wrap.className   = isIn ? 'popup-icon-wrap icon-in' : 'popup-icon-wrap icon-out';
    glow.className   = isIn ? 'popup-glow glow-in' : 'popup-glow glow-out';
    typeEl.className = isIn ? 'popup-type type-in' : 'popup-type type-out';
    closeBtn.className = isIn ? 'popup-close close-in' : 'popup-close close-out';

    // icon SVG
    svgEl.innerHTML = isIn
      ? `<polyline points="8,22 18,32 36,14" stroke="#00e5a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`
      : `<line x1="12" y1="12" x2="32" y2="32" stroke="#ff4d6d" stroke-width="4" stroke-linecap="round"/>
         <line x1="32" y1="12" x2="12" y2="32" stroke="#ff4d6d" stroke-width="4" stroke-linecap="round"/>`;

    typeEl.textContent = isIn ? '✦ CHECK IN ✦' : '✦ CHECK OUT ✦';
    nameEl.textContent = nickname;
    msgEl.textContent  = isIn ? 'บันทึกเข้างานสำเร็จแล้ว 🎉' : 'บันทึกออกงานสำเร็จแล้ว 👋';
    timeEl.textContent = timeStr;
    dateEl.textContent = dateStr;

    // รูปถ่าย
    if (photoBase64) {
      photoEl.src = photoBase64;
      photoEl.style.display = 'block';
      photoEl.style.borderColor = isIn ? 'var(--accent-in)' : 'var(--accent-out)';
    } else {
      photoEl.style.display = 'none';
    }

    // ── สร้าง confetti ────────────────────────────────────────
    spawnParticles(isIn);

    // ── แสดง popup ────────────────────────────────────────────
    const popup = document.getElementById('success-popup');
    popup.style.opacity = '';
    popup.className = 'show';

    // ปิดอัตโนมัติหลัง 5 วินาที
    clearTimeout(window._popupTimer);
    window._popupTimer = setTimeout(closeSuccessPopup, 5000);
  }

  function closeSuccessPopup() {
    clearTimeout(window._popupTimer);
    const popup = document.getElementById('success-popup');
    popup.className = 'hide';
    setTimeout(() => { popup.className = ''; popup.style.opacity = '0'; }, 300);
  }

  function spawnParticles(isIn) {
    const container = document.getElementById('popup-particles');
    container.innerHTML = '';
    const colors = isIn
      ? ['#00e5a0','#00c87a','#4dffc8','#b3ffe4','#fff']
      : ['#ff4d6d','#e0304f','#ff8fa3','#ffd6de','#fff'];
    const cx = 180, cy = 120; // rough center of card
    for (let i = 0; i < 30; i++) {
      const el = document.createElement('div');
      el.className = 'particle';
      const angle = (Math.random() * 360) * Math.PI / 180;
      const dist  = 80 + Math.random() * 140;
      const tx    = Math.cos(angle) * dist;
      const ty    = Math.sin(angle) * dist - 60;
      const rot   = (Math.random() - 0.5) * 720;
      el.style.cssText = `
        left: ${cx + (Math.random()-0.5)*60}px;
        top:  ${cy + (Math.random()-0.5)*40}px;
        background: ${colors[Math.floor(Math.random()*colors.length)]};
        --tx: ${tx}px; --ty: ${ty}px; --rot: ${rot}deg;
        animation-delay: ${Math.random()*0.3}s;
        animation-duration: ${0.9 + Math.random()*0.5}s;
        border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
      `;
      container.appendChild(el);
    }
  }

  function onEmployeeChange() {
    todayStatus = { checkin: false, checkout: false };
    updateSubmitButton();
    const name = document.getElementById('name-input').value.trim();
    if (name) {
      clearTimeout(statusCheckTimeout);
      statusCheckTimeout = setTimeout(() => checkEmployeeStatus(name), 400);
    } else {
      document.getElementById('status-bar').style.display = 'none';
    }
  }

  // ============================================================
  // HISTORY
  // ============================================================
  function addHistory(name, type, status, driveLink = '') {
    const item = {
      name, type, status, driveLink,
      time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
      date: new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short' })
    };
    history.unshift(item);
    if (history.length > 20) history.pop();
    localStorage.setItem('checkin_history', JSON.stringify(history));
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    if (!history.length) {
      list.innerHTML = '<div style="text-align:center;color:var(--text-dim);font-size:13px;padding:16px 0">ยังไม่มีประวัติ</div>';
      return;
    }
    list.innerHTML = history.map(item => `
      <div class="history-item">
        <span class="history-badge ${item.type === 'เข้างาน' ? 'badge-in' : 'badge-out'}">${item.type}</span>
        <div class="history-info">
          <div class="history-name">${escapeHTML(item.name)}</div>
          <div class="history-time">${item.date} · ${item.time}</div>
          ${item.driveLink ? `<a href="${item.driveLink}" target="_blank" rel="noopener" style="font-size:11px;color:var(--accent-blue);text-decoration:none;display:inline-flex;align-items:center;gap:3px;margin-top:3px">🔗 ดูรูปภาพ</a>` : ''}
        </div>
        <span class="history-status ${item.status === 'error' ? 'err' : ''}">${item.status === 'success' ? '✓ สำเร็จ' : '✗ ผิดพลาด'}</span>
      </div>
    `).join('');
  }

  function clearHistory() {
    history = [];
    localStorage.removeItem('checkin_history');
    renderHistory();
  }

  function escapeHTML(str) {
    return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // ============================================================
  // TOAST
  // ============================================================
  let toastTimer;
  function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-msg');
    clearTimeout(toastTimer);
    toastMsg.textContent = msg;
    toast.className = 'show ' + (type === 'error' ? 'error' : type === 'success' ? 'success' : '');
    toastTimer = setTimeout(() => { toast.className = ''; }, 3000);
  }



  // ============================================================
  // INIT
  // ============================================================
  window.addEventListener('load', async () => {
    // First get permission, then enumerate devices for accurate labels
    await startCamera();
    await enumerateDevices();
    loadFaceApi();  // โหลด AI model (background)
    renderHistory();

    // Restore last selected employee and check status
    const savedName = localStorage.getItem('saved_name');
    if (savedName) {
      const sel = document.getElementById('name-input');
      for (let i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === savedName) {
          sel.selectedIndex = i;
          checkEmployeeStatus(savedName);
          break;
        }
      }
    }

    // Prompt settings only if URL was manually cleared
    if (!GAS_URL) {
      setTimeout(openSettings, 800);
    }

    // Initial type setup
    setType('in');
    updateSubmitButton();
  });
</script>
</body>
</html>

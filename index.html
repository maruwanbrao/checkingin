<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกเวลาเข้า-ออกงาน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
        .video-container { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; width: 100%; }
        #camera { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
        <div class="bg-blue-600 p-4 text-center">
            <h1 class="text-2xl font-bold text-white">ระบบลงเวลาทำงาน</h1>
            <p class="text-blue-100 text-sm mt-1">Check-in / Check-out System</p>
        </div>

        <div class="p-6">
            <div id="cameraSelectDiv" class="mb-3 hidden">
                <label class="text-xs text-gray-500 mb-1 block">เลือกกล้อง:</label>
                <select id="cameraSelect" class="w-full text-sm px-3 py-2 border border-gray-300 rounded-lg outline-none bg-gray-50"></select>
            </div>

            <div class="video-container mb-4 flex items-center justify-center">
                <video id="camera" autoplay playsinline></video>
                <div id="loadingSign" class="absolute text-white text-xs text-center flex flex-col items-center">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-white mb-2"></div>
                    <p>กำลังเตรียมกล้อง...</p>
                </div>
            </div>

            <canvas id="snapshot" class="hidden"></canvas>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล พนักงาน</label>
                <input type="text" id="employeeName" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="ใส่ชื่อพนักงาน">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="submitData('เข้างาน')" id="btnIn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg shadow-md active:transform active:scale-95 transition disabled:opacity-50">เข้างาน</button>
                <button onclick="submitData('ออกงาน')" id="btnOut" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-lg shadow-md active:transform active:scale-95 transition disabled:opacity-50">ออกงาน</button>
            </div>

            <div id="statusMessage" class="mt-4 text-center text-sm font-medium min-h-[24px] p-2 rounded"></div>
        </div>
    </div>

    <script>
        // ลิงก์ Deployment ล่าสุดของคุณ
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxlhMMUQdPf0vyxmtJi6O6SkjDVwhdZczuUbJuH20WNUHGGk4W0pYtcZ3XzU37R1hKx/exec';

        const video = document.getElementById('camera');
        const loadingSign = document.getElementById('loadingSign');
        const cameraSelect = document.getElementById('cameraSelect');
        const cameraSelectDiv = document.getElementById('cameraSelectDiv');
        let currentStream = null;

        async function startApp() {
            try {
                const initialStream = await navigator.mediaDevices.getUserMedia({ video: true });
                initialStream.getTracks().forEach(track => track.stop());
                
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');

                if (videoDevices.length > 0) {
                    cameraSelectDiv.classList.remove('hidden');
                    cameraSelect.innerHTML = '';
                    videoDevices.forEach(device => {
                        const opt = document.createElement('option');
                        opt.value = device.deviceId;
                        opt.text = device.label || `Camera ${cameraSelect.length + 1}`;
                        cameraSelect.appendChild(opt);
                    });
                    
                    cameraSelect.onchange = () => openCamera(cameraSelect.value);
                    await openCamera(videoDevices[0].deviceId);
                }
            } catch (err) {
                loadingSign.innerHTML = '<p class="text-red-500 font-bold">ไม่สามารถเข้าถึงกล้องได้</p>';
            }
        }

        async function openCamera(id) {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { deviceId: id ? { exact: id } : undefined } 
                });
                video.srcObject = currentStream;
                loadingSign.classList.add('hidden');
            } catch (err) {
                console.error(err);
            }
        }

        async function submitData(type) {
            const name = document.getElementById('employeeName').value.trim();
            if (!name) {
                showStatus('❌ กรุณาใส่ชื่อพนักงาน', 'text-red-600 bg-red-50');
                return;
            }

            const btnIn = document.getElementById('btnIn');
            const btnOut = document.getElementById('btnOut');
            btnIn.disabled = btnOut.disabled = true;
            showStatus('⌛ กำลังบันทึกข้อมูล...', 'text-blue-600 bg-blue-50');

            try {
                const canvas = document.getElementById('snapshot');
                canvas.width = 400;
                canvas.height = 300;
                const ctx = canvas.getContext('2d');
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const base64 = canvas.toDataURL('image/jpeg', 0.5); // บีบอัดรูปภาพลงเพื่อให้ส่งง่ายขึ้น

                // เปลี่ยนมาใช้ URLSearchParams เพื่อให้ข้อมูลส่งไปถึง doPost ได้แม่นยำที่สุด
                const formData = new URLSearchParams();
                formData.append('name', name);
                formData.append('type', type);
                formData.append('image', base64);

                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });

                // เนื่องจากโหมด no-cors เราจะอนุมานว่าสำเร็จถ้าไม่มี Error เด้ง
                showStatus(`✅ บันทึก ${type} สำเร็จ! โปรดเช็คใน Google Sheets`, 'text-green-600 bg-green-50');
                document.getElementById('employeeName').value = "";
                
            } catch (e) {
                showStatus("❌ การเชื่อมต่อผิดพลาด", "text-red-600 bg-red-50");
            } finally {
                btnIn.disabled = btnOut.disabled = false;
            }
        }

        function showStatus(msg, classes) {
            const status = document.getElementById('statusMessage');
            status.innerText = msg;
            status.className = `mt-4 text-center text-sm font-medium min-h-[24px] p-2 rounded ${classes}`;
        }

        window.onload = startApp;
    </script>
</body>
</html>

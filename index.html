<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกเวลาเข้า-ออกงาน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
        <div class="bg-blue-600 p-4 text-center">
            <h1 class="text-2xl font-bold text-white">ระบบลงเวลาทำงาน</h1>
            <p class="text-blue-100 text-sm mt-1">Check-in / Check-out System</p>
        </div>

        <div class="p-6">
            
            <!-- เมนูเลือกกล้อง (เพิ่มใหม่) -->
            <div class="mb-3">
                <select id="cameraSelect" class="w-full text-sm px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 hidden bg-gray-50">
                    <option value="">กำลังค้นหากล้อง...</option>
                </select>
            </div>

            <!-- Camera View -->
            <div class="relative bg-black rounded-lg overflow-hidden mb-4 aspect-video flex items-center justify-center">
                <video id="camera" class="w-full h-full object-cover" autoplay playsinline></video>
                <div id="cameraError" class="absolute inset-0 flex items-center justify-center text-white text-center p-4 hidden bg-gray-800">
                    <p class="text-sm" id="cameraErrorText">กำลังเชื่อมต่อกล้อง...</p>
                </div>
            </div>

            <!-- Canvas for capturing image (Hidden) -->
            <canvas id="snapshot" class="hidden"></canvas>

            <!-- Input Form -->
            <div class="mb-4">
                <label for="employeeName" class="block text-sm font-medium text-gray-700 mb-1">รหัสพนักงาน / ชื่อ-นามสกุล</label>
                <input type="text" id="employeeName" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="ระบุชื่อหรือรหัสพนักงาน">
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-4">
                <button onclick="submitData('เข้างาน')" id="btnIn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow transition flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                    เข้างาน (In)
                </button>
                <button onclick="submitData('ออกงาน')" id="btnOut" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-lg shadow transition flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    ออกงาน (Out)
                </button>
            </div>

            <!-- Status Message -->
            <div id="statusMessage" class="mt-4 text-center text-sm font-medium h-6"></div>
        </div>
    </div>

    <script>
        // *** อย่าลืมตรวจสอบ URL นี้ว่ามาจากการ Deploy แบบ "ทุกคน (Anyone)" ***
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbygrqeWn2FRnKE-pvY8muoK14PsKekG-mInyYXJwm9IjkLtxSQsBDBKZEHocFuda3KU/exec';

        const video = document.getElementById('camera');
        const canvas = document.getElementById('snapshot');
        const cameraError = document.getElementById('cameraError');
        const cameraErrorText = document.getElementById('cameraErrorText');
        const statusMessage = document.getElementById('statusMessage');
        const btnIn = document.getElementById('btnIn');
        const btnOut = document.getElementById('btnOut');
        const cameraSelect = document.getElementById('cameraSelect');
        
        let currentStream = null;

        // ฟังก์ชันเริ่มต้น: ค้นหากล้องทั้งหมดในเครื่อง
        async function initCameras() {
            try {
                // ขออนุญาตใช้กล้องเบื้องต้น เพื่อให้ดึงรายชื่อกล้องได้
                const initialStream = await navigator.mediaDevices.getUserMedia({ video: true });
                
                // ดึงรายการอุปกรณ์ทั้งหมด
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');

                cameraSelect.innerHTML = '';
                
                if (videoDevices.length > 0) {
                    cameraSelect.classList.remove('hidden');
                    
                    // เพิ่มตัวเลือกกล้องลงใน Dropdown
                    videoDevices.forEach((device, index) => {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        option.text = device.label || `กล้องตัวที่ ${index + 1}`;
                        cameraSelect.appendChild(option);
                    });

                    // หยุดการใช้ stream ตัวแรกที่ขอก่อน
                    initialStream.getTracks().forEach(track => track.stop());

                    // เริ่มเปิดกล้องตามที่เลือกไว้เป็นอันดับแรก
                    startCamera(cameraSelect.value);

                    // เมื่อผู้ใช้เลือกเปลี่ยนกล้อง
                    cameraSelect.addEventListener('change', () => {
                        startCamera(cameraSelect.value);
                    });

                } else {
                    showCameraError('ไม่พบอุปกรณ์กล้องบนเครื่องนี้');
                }
            } catch (err) {
                console.error("Init camera error: ", err);
                showCameraError('กรุณากด "Allow" (อนุญาต) ให้เว็บไซต์เข้าถึงกล้อง');
            }
        }

        // ฟังก์ชันเปิดกล้องตาม ID ที่เลือก
        async function startCamera(deviceId) {
            // ปิดกล้องเก่าก่อน (ถ้ามี)
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { deviceId: deviceId ? { exact: deviceId } : undefined }
                });
                video.srcObject = currentStream;
                cameraError.classList.add('hidden');
                video.classList.remove('hidden');
            } catch (err) {
                console.error("Start camera error: ", err);
                showCameraError('ไม่สามารถแสดงภาพจากกล้องที่เลือกได้');
            }
        }

        function showCameraError(msg) {
            video.classList.add('hidden');
            cameraError.classList.remove('hidden');
            cameraErrorText.innerHTML = msg;
        }

        // เริ่มทำงานเมื่อโหลดหน้าเว็บ
        window.onload = initCameras;

        // ฟังก์ชันส่งข้อมูล
        async function submitData(type) {
            const employeeName = document.getElementById('employeeName').value.trim();
            
            if (!employeeName) {
                showMessage('กรุณาระบุชื่อหรือรหัสพนักงาน!', 'text-red-500');
                return;
            }

            // เช็คว่ามีภาพวิดีโอเล่นอยู่จริงๆ ไหม
            if (!video.srcObject || !video.srcObject.active) {
                showMessage('กล้องยังไม่พร้อมใช้งาน กรุณาตรวจสอบกล้อง', 'text-red-500');
                return;
            }

            // ล็อกปุ่ม
            btnIn.disabled = true;
            btnOut.disabled = true;
            showMessage('กำลังบันทึกข้อมูลและส่งรูปภาพ...', 'text-blue-500');

            try {
                // ถ่ายรูป
                const context = canvas.getContext('2d');
                canvas.width = 320; 
                canvas.height = 240;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageBase64 = canvas.toDataURL('image/jpeg', 0.7); 

                // สร้างข้อมูล
                const payload = {
                    name: employeeName,
                    type: type,
                    timestamp: new Date().toLocaleString('th-TH'),
                    image: imageBase64
                };

                // ส่งข้อมูล
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8',
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === 'success') {
                    showMessage(`✅ บันทึกเวลา${type} สำเร็จ!`, 'text-green-600');
                    document.getElementById('employeeName').value = '';
                } else {
                    showMessage(`❌ เกิดข้อผิดพลาดฝั่งเซิร์ฟเวอร์`, 'text-red-500');
                }

            } catch (error) {
                console.error('Network Error:', error);
                // เปลี่ยนข้อความแจ้งเตือนให้ชัดเจนขึ้น
                showMessage('❌ ส่งไม่ผ่าน: โปรดเช็คสิทธิ์ Google Apps Script ว่าตั้งเป็น "ทุกคน" (Anyone) หรือยัง', 'text-red-500');
            } finally {
                // ปลดล็อกปุ่ม
                btnIn.disabled = false;
                btnOut.disabled = false;
            }
        }

        function showMessage(msg, colorClass) {
            statusMessage.className = `mt-4 text-center text-sm font-medium h-6 transition-all ${colorClass}`;
            statusMessage.textContent = msg;
            
            if(colorClass.includes('green') || colorClass.includes('red')) {
                setTimeout(() => {
                    statusMessage.textContent = '';
                }, 6000);
            }
        }
    </script>
</body>
</html>
